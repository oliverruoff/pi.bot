<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>pi.bot</title>
<style>
:root{font-family:Inter,ui-rounded,system-ui,sans-serif;color-scheme:dark;--bg:#07111f;--card:#0d1b2b;--line:#20364d;--cyan:#52e5cf;--muted:#91a4b8;--red:#ff4d5e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12304a,var(--bg) 32%);color:#eef7ff;height:100dvh;overflow:hidden}.app{height:100%;max-width:700px;margin:auto;display:grid;grid-template-rows:auto auto minmax(140px,1fr) auto;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);gap:8px}header{display:flex;align-items:center;gap:9px;padding:7px 2px}.brand{font-size:1.08rem;font-weight:800;letter-spacing:.02em}.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 10px currentColor}.state{font-size:.75rem;color:var(--muted);flex:1}.btn{border:1px solid var(--line);background:#122439;color:#eef7ff;border-radius:12px;padding:10px 13px;font-weight:700}.emergency{background:var(--red);border:0;box-shadow:0 4px 16px #ff4d5e44}.camera{position:relative;background:#020609;border:1px solid var(--line);border-radius:15px;overflow:hidden;height:min(26dvh,190px)}.camera img{width:100%;height:100%;object-fit:cover}.camera-tag{position:absolute;left:8px;top:8px;background:#07111fbb;border:1px solid #ffffff22;border-radius:999px;padding:4px 8px;font-size:.68rem}.chat{background:#0a1725cc;border:1px solid var(--line);border-radius:15px;display:flex;flex-direction:column;min-height:0}.chatbar{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted)}.chatbar strong{color:#eef7ff;flex:1}.messages{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1}.bubble{max-width:88%;padding:9px 11px;border-radius:14px;font-size:.88rem;line-height:1.4;white-space:pre-wrap}.user{align-self:flex-end;background:#236d72}.assistant{align-self:flex-start;background:#162b41;border:1px solid #29435c}.error{align-self:center;background:#4b1f29}.empty{color:var(--muted);font-size:.82rem;text-align:center;margin:auto;padding:16px}.composer{display:flex;gap:7px;padding:8px;border-top:1px solid var(--line)}textarea{resize:none;min-height:41px;max-height:84px;flex:1;border:1px solid var(--line);border-radius:12px;background:#07111f;color:white;padding:10px;font:inherit}.send{background:var(--cyan);color:#06221e;border:0;border-radius:12px;padding:0 17px;font-weight:900}.controls{display:grid;grid-template-columns:80px 1fr 80px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px}.strafe{height:72px;font-size:1.35rem}.joy{position:relative;margin:auto;width:116px;height:116px;border-radius:50%;border:2px solid #35516e;background:radial-gradient(circle,#142b41 0 24%,#091624 25% 66%,#172d43 67%);touch-action:none}.joy:before,.joy:after{content:"";position:absolute;background:#304961}.joy:before{left:50%;top:10%;width:1px;height:80%}.joy:after{top:50%;left:10%;height:1px;width:80%}.knob{position:absolute;width:46px;height:46px;left:33px;top:33px;border-radius:50%;background:var(--cyan);box-shadow:0 5px 18px #0009;pointer-events:none}.speedrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:.7rem;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--cyan)}button{touch-action:none;user-select:none;cursor:pointer}button.active{outline:3px solid var(--cyan)}@media(min-width:720px){.app{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto}header{grid-column:1/-1}.camera{height:auto}.chat{grid-row:2/4;grid-column:2}.controls{grid-column:1}.camera{grid-column:1}}
</style></head><body><main class="app"><header><span class="dot" id="dot"></span><span class="brand">PI.BOT</span><span class="state" id="robotState">Verbinde …</span><button class="btn" id="newChat">Neuer Chat</button><button class="btn emergency" id="stop">STOP</button></header>
<section class="camera"><img src="/stream.mjpg" alt="Live-Kamera"><span class="camera-tag">● LIVE</span><button class="btn" style="position:absolute;right:8px;top:8px;padding:5px 9px;background:#07111fbb;font-size:.7rem" id="history">Verlauf</button></section><dialog style="max-width:580px;width:90%;max-height:75dvh;border:1px solid #20364d;border-radius:16px;background:#0d1b2b;color:white" id="historyDialog"><button class="btn" id="closeHistory">Schließen</button><h3>Frühere Chats</h3><div style="display:flex;flex-direction:column;gap:8px;overflow:auto" id="archiveList"></div></dialog>
<section class="chat"><div class="chatbar"><strong>Unterhaltung</strong><span id="agentState">Bereit</span></div><div class="messages" id="messages"><div class="empty">Sag mir, wobei ich dir helfen oder wohin ich fahren soll.</div></div><form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="Nachricht an pi.bot …"></textarea><button class="send">↑</button></form></section>
<section class="controls"><button class="btn strafe" id="left">⇦</button><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="btn strafe" id="right">⇨</button><div class="speedrow"><span>Tempo</span><input id="speed" type="range" min="50" max="100" value="70"><span id="speedValue">70%</span></div></section></main>
<script>
const $=s=>document.querySelector(s),post=(url,body={})=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let revision=-1;
async function poll(){try{const r=await fetch(`/api/chat?after=${revision}&timeout=20`),s=await r.json();revision=s.revision;$('#agentState').textContent=s.status;render(s.messages);setTimeout(poll,50)}catch(e){$('#agentState').textContent='Verbindung unterbrochen';setTimeout(poll,1500)}}
function render(items){const box=$('#messages');if(!items.length){box.innerHTML='<div class="empty">Sag mir, wobei ich dir helfen oder wohin ich fahren soll.</div>';return}const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.replaceChildren(...items.map(x=>{const el=document.createElement('div');el.className=`bubble ${x.role}`;el.textContent=x.text;return el}));if(nearBottom)box.scrollTop=box.scrollHeight}
$('#composer').onsubmit=async e=>{e.preventDefault();const p=$('#prompt'),message=p.value.trim();if(!message)return;p.value='';const r=await post('/api/chat',{message});if(!r.ok){const s=await r.json();alert(s.error)}};$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}};
$('#newChat').onclick=async()=>{if(confirm('Neue Unterhaltung starten? (Frühere Chats bleiben im Verlauf.)')){const r=await post('/api/chat/new');if(!r.ok)alert((await r.json()).error)}};async function showHistory(){const s=await(await fetch('/api/chat/archives')).json(),list=$('#archiveList');list.replaceChildren(...s.chats.map(c=>{const b=document.createElement('button');b.className='btn';b.textContent=c.title;b.onclick=()=>{render(c.messages);$('#historyDialog').close()};return b}));if(!s.chats.length)list.textContent='Noch keine früheren Chats.';$('#historyDialog').showModal()}$('#history').onclick=showHistory;$('#closeHistory').onclick=()=>$('#historyDialog').close();$('#stop').onclick=()=>post('/api/chat/stop');
const joy=$('#joy'),knob=$('#knob'),vector={forward:0,turn:0,strafe:0,pointer:null};let timer;
function send(){post('/api/vector',{forward:vector.forward,turn:vector.turn,strafe:vector.strafe,speed:+$('#speed').value/100})}function loop(){const active=Math.abs(vector.forward)+Math.abs(vector.turn)+Math.abs(vector.strafe)>.02;if(!active){clearInterval(timer);timer=null;post('/api/stop');return}if(!timer){send();timer=setInterval(send,120)}}
function update(e){const r=joy.getBoundingClientRect(),radius=(r.width-knob.offsetWidth)/2;let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y);if(d>radius){x*=radius/d;y*=radius/d}knob.style.transform=`translate(${x}px,${y}px)`;vector.turn=Math.abs(x/radius)<.12?0:x/radius;vector.forward=Math.abs(y/radius)<.12?0:-y/radius;loop()}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);vector.pointer=e.pointerId;update(e)};joy.onpointermove=e=>{if(e.pointerId===vector.pointer)update(e)};function reset(){vector.forward=vector.turn=0;vector.pointer=null;knob.style.transform='';loop()}['pointerup','pointercancel','lostpointercapture'].forEach(n=>joy.addEventListener(n,reset));
function strafe(el,v){const start=e=>{el.setPointerCapture(e.pointerId);el.classList.add('active');vector.strafe=v;loop()},end=()=>{el.classList.remove('active');vector.strafe=0;loop()};el.onpointerdown=start;['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,end))}strafe($('#left'),-1);strafe($('#right'),1);$('#speed').oninput=e=>$('#speedValue').textContent=e.target.value+'%';window.onblur=()=>{vector.forward=vector.turn=vector.strafe=0;reset()};
async function status(){try{const s=await(await fetch('/api/status')).json();$('#dot').style.background=s.ok?'#52e5cf':'#ff4d5e';$('#robotState').textContent=s.camera==='ok'?'Kamera & System bereit':`System bereit · Kamera: ${s.camera}`}catch{$('#dot').style.background='#ff4d5e';$('#robotState').textContent='Offline'}setTimeout(status,4000)}poll();status();
</script></body></html>
